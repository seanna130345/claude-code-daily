name: 你关注的热点

on:
  schedule:
    # 每天北京时间 05:30 运行 (UTC 21:30 前一天)
    - cron: "30 21 * * *"
  workflow_dispatch:  # 支持手动触发

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx beautifulsoup4

      - name: Run daily report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLTCY_API_KEY: ${{ secrets.BLTCY_API_KEY }}
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
          PAGES_URL: "https://seanna130345.github.io/hot-topics-daily"
        run: python main.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "daily report $(date +%Y-%m-%d)"
          git push
